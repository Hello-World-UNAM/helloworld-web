# Configuración de Dependabot para el repo del Club Hello World.
# Revisa dependencias semanalmente y abre PRs agrupados por ecosistema
# para no saturar la revisión.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Dependencias npm del proyecto Astro
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      supabase:
        patterns:
          - "@supabase/*"
      vercel:
        patterns:
          - "@vercel/*"
      dev-dependencies:
        dependency-type: "development"
